<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sub Alert — MizuBot</title>
    <style>
        :root { --purple: #9146ff; --pink: #e85bff; }
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; }
        body { display: grid; place-items: center; overflow: hidden; background: transparent; color: #fff; font-family: Inter, "Segoe UI", sans-serif; }
        #status { position: fixed; right: 14px; bottom: 14px; display: none; padding: 8px 12px; border: 1px solid #ff6b75; border-radius: 8px; background: #17131c; color: #ff8991; font: 12px monospace; }
        #status.show { display: block; }
        .alert {
            position: relative; width: min(900px, calc(100vw - 48px)); padding: 37px 48px 34px;
            overflow: hidden; border: 1px solid rgba(199, 165, 255, .58); border-radius: 26px;
            background: linear-gradient(135deg, rgba(29, 22, 42, .97), rgba(17, 14, 24, .96) 72%);
            text-align: center; box-shadow: 0 25px 90px rgba(20, 5, 40, .5), 0 0 45px rgba(145, 70, 255, .2);
            opacity: 0; transform: scale(.9) translateY(24px); pointer-events: none;
        }
        .alert::before { position: absolute; top: 0; left: 12%; width: 76%; height: 3px; content: ""; background: linear-gradient(90deg, transparent, #9146ff, #ed8cff, #9146ff, transparent); }
        .alert::after { position: absolute; top: -95px; left: calc(50% - 100px); width: 200px; height: 200px; border-radius: 50%; background: rgba(145, 70, 255, .16); filter: blur(12px); content: ""; }
        .sub-icon { position: relative; z-index: 1; display: grid; width: 70px; height: 70px; margin: 0 auto 19px; place-items: center; border: 1px solid rgba(202, 174, 255, .55); border-radius: 22px; background: rgba(145, 70, 255, .19); color: #d8bcff; font-size: 34px; }
        .eyebrow { position: relative; z-index: 1; color: #c5a0ff; font-size: 13px; font-weight: 800; letter-spacing: .24em; text-transform: uppercase; }
        #main { position: relative; z-index: 1; margin-top: 10px; overflow-wrap: anywhere; font-size: clamp(31px, 6vw, 68px); font-weight: 900; line-height: 1.05; letter-spacing: -.05em; }
        #sub { position: relative; z-index: 1; margin-top: 14px; color: #e3d8ef; font-size: clamp(17px, 2.5vw, 27px); }
        .active { animation: sub-in .7s cubic-bezier(.16, 1, .3, 1) forwards; }
        .leaving { animation: sub-out .35s ease-in forwards; }
        .active .sub-icon { animation: heart-beat .9s .2s ease both; }
        @keyframes sub-in { to { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes sub-out { to { opacity: 0; transform: scale(.97) translateY(-10px); } }
        @keyframes heart-beat { 0% { transform: scale(.4) rotate(-15deg); } 55% { transform: scale(1.17) rotate(5deg); } 75% { transform: scale(.95); } 100% { transform: scale(1); } }
        @media (max-width: 560px) { .alert { padding: 28px 22px; } }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; } }
    </style>
</head>
<body>
    <div id="status">SUBS OVERLAY: NOT CONNECTED</div>
    <main class="alert" id="container" aria-live="polite">
        <div class="sub-icon" aria-hidden="true">✦</div>
        <div class="eyebrow">A new level of support</div>
        <div id="main"></div>
        <div id="sub"></div>
    </main>
    <script src="../script.js"></script>
    <script>
        const subContainer = document.getElementById('container');
        const subMain = document.getElementById('main');
        const subText = document.getElementById('sub');
        let subHideTimeout = null;
        const relayUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://') + (location.host || '127.0.0.1:8766');

        function showSubOverlay() {
            subContainer.classList.remove('active', 'leaving');
            void subContainer.offsetWidth;
            subContainer.classList.add('active');
            clearTimeout(subHideTimeout);
            subHideTimeout = setTimeout(() => {
                subContainer.classList.remove('active');
                subContainer.classList.add('leaving');
            }, 6000);
        }

        function handleSubDisplay(data) {
            const user = data?.user || data?.username || 'Someone';
            const months = data?.months ?? 1;
            subMain.textContent = `${user} subscribed!`;
            subText.textContent = `${months} month${months !== 1 ? 's' : ''} of support`;
            showSubOverlay();
        }

        function handleGiftSubDisplay(data) {
            const sender = data?.sender || 'Someone';
            const recipient = data?.recipient || 'a viewer';
            subMain.textContent = `${sender} gifted a sub!`;
            subText.textContent = `for ${recipient}`;
            showSubOverlay();
        }

        const wsClient = new OverlayWebSocketClient(relayUrl, 'status', 'SUBS');
        wsClient.registerHandler('sub', handleSubDisplay);
        wsClient.registerHandler('gift_sub', handleGiftSubDisplay);
        wsClient.connect();
    </script>
</body>
</html>
