<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Follow Alert — MizuBot</title>
    <style>
        :root { color-scheme: dark; --purple: #9146ff; --pink: #e85bff; }
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; }
        body {
            display: grid;
            place-items: center;
            overflow: hidden;
            background: transparent;
            color: #fff;
            font-family: Inter, "Segoe UI", sans-serif;
        }
        #status {
            position: fixed; right: 14px; bottom: 14px; display: none;
            padding: 8px 12px; border: 1px solid #ff6b75; border-radius: 8px;
            background: #17131c; color: #ff8991; font: 12px monospace;
        }
        #status.show { display: block; }
        .alert {
            position: relative; display: flex; align-items: center; gap: 24px;
            width: min(850px, calc(100vw - 48px)); padding: 30px 42px;
            overflow: hidden; border: 1px solid rgba(195, 153, 255, .55);
            border-radius: 22px; background: linear-gradient(110deg, rgba(25, 19, 36, .97), rgba(31, 20, 47, .93));
            box-shadow: 0 18px 70px rgba(30, 8, 50, .4), 0 0 40px rgba(145, 70, 255, .22);
            opacity: 0; transform: translateY(24px) scale(.96); pointer-events: none;
        }
        .alert::before {
            position: absolute; inset: 0 auto 0 0; width: 7px; content: "";
            background: linear-gradient(#b67cff, #9146ff, #e85bff);
        }
        .alert::after {
            position: absolute; top: -90px; right: -40px; width: 220px; height: 220px;
            border-radius: 50%; background: rgba(145, 70, 255, .16); filter: blur(10px); content: "";
        }
        .icon {
            z-index: 1; display: grid; flex: 0 0 82px; width: 82px; height: 82px;
            place-items: center; border: 1px solid rgba(196, 156, 255, .55);
            border-radius: 24px; background: rgba(145, 70, 255, .18);
            color: #d4b5ff; font-size: 40px; box-shadow: inset 0 0 24px rgba(145, 70, 255, .16);
        }
        .copy { z-index: 1; min-width: 0; }
        .eyebrow { margin-bottom: 7px; color: #c9a8ff; font-size: 13px; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; }
        #main {
            max-width: 100%; overflow-wrap: anywhere; font-size: clamp(30px, 6vw, 62px);
            font-weight: 850; line-height: 1.02; letter-spacing: -.045em;
        }
        #sub { margin-top: 10px; color: #ddd0ed; font-size: clamp(16px, 2.3vw, 23px); font-weight: 550; }
        .active { animation: arrive .65s cubic-bezier(.16, 1, .3, 1) forwards; }
        .leaving { animation: depart .35s ease-in forwards; }
        .active .icon { animation: icon-pop .7s .12s cubic-bezier(.16, 1, .3, 1) both; }
        @keyframes arrive { to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes depart { to { opacity: 0; transform: translateY(-12px) scale(.98); } }
        @keyframes icon-pop { 0% { transform: rotate(-12deg) scale(.5); } 65% { transform: rotate(5deg) scale(1.12); } 100% { transform: rotate(0) scale(1); } }
        @media (max-width: 560px) {
            .alert { gap: 15px; padding: 23px 22px; }
            .icon { flex-basis: 58px; width: 58px; height: 58px; border-radius: 18px; font-size: 30px; }
        }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; } }
    </style>
</head>
<body>
    <div id="status">FOLLOW OVERLAY: NOT CONNECTED</div>
    <main class="alert" id="container" aria-live="polite">
        <div class="icon" aria-hidden="true">✦</div>
        <div class="copy">
            <div class="eyebrow">New community member</div>
            <div id="main"></div>
            <div id="sub">is now following</div>
        </div>
    </main>
    <script src="../script.js"></script>
    <script>
        const followContainer = document.getElementById('container');
        const followMain = document.getElementById('main');
        let followHideTimeout = null;
        const relayUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://') + (location.host || '127.0.0.1:8766');

        function handleFollowDisplay(data) {
            followMain.textContent = data?.user || 'Someone';
            followContainer.classList.remove('active', 'leaving');
            void followContainer.offsetWidth;
            followContainer.classList.add('active');
            clearTimeout(followHideTimeout);
            followHideTimeout = setTimeout(() => {
                followContainer.classList.remove('active');
                followContainer.classList.add('leaving');
            }, 5000);
        }

        const wsClient = new OverlayWebSocketClient(relayUrl, 'status', 'FOLLOW');
        wsClient.registerHandler('follow', handleFollowDisplay);
        wsClient.connect();
    </script>
</body>
</html>
