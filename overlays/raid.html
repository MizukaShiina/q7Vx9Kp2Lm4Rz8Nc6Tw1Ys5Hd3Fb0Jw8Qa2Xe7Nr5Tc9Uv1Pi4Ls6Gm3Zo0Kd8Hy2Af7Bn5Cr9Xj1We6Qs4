<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>MizuBot Raid Overlay</title>

    <style>
        body {
            background: transparent;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
        }

        /* 🌌 FULL SCREEN RAID TAKEOVER */
        #alert-container {
            position: fixed;
            inset: 0;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            opacity: 0;

            text-align: center;
            color: white;

            background: rgba(0, 0, 0, 0);

            pointer-events: none;
        }

        /* BIG RAID TEXT */
        #main-text {
            font-size: 120px;
            font-weight: 900;
            letter-spacing: 6px;
            text-transform: uppercase;

            color: #ffffff;

            text-shadow:
                0 0 10px rgba(145, 70, 255, 0.9),
                0 0 25px rgba(145, 70, 255, 0.6),
                0 0 40px rgba(145, 70, 255, 0.4);
        }

        /* VIEWER TEXT */
        #viewer-text {
            font-size: 40px;
            margin-top: 20px;
            color: #ffd700;

            text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        /* SHOW STATE (NO FLASHING, NO PULSE) */
        .show {
            opacity: 1 !important;
            background: rgba(0, 0, 0, 0.65);
            animation: popIn 0.4s ease-out forwards;
        }

        .hide {
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        /* clean pop only */
        @keyframes popIn {
            0% {
                transform: scale(0.6);
                opacity: 0;
            }

            70% {
                transform: scale(1.08);
                opacity: 1;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* glow stays (keeps energy) */
        @keyframes glow {
            0% {
                filter: drop-shadow(0 0 10px rgba(145, 70, 255, 0.4));
            }

            50% {
                filter: drop-shadow(0 0 25px rgba(145, 70, 255, 0.8));
            }

            100% {
                filter: drop-shadow(0 0 10px rgba(145, 70, 255, 0.4));
            }
        }

        #alert-container.show #main-text {
            animation: glow 2s infinite;
        }

        /* 🔌 CONNECTION STATUS (ONLY WHEN DISCONNECTED) */
        #status {
            position: absolute;
            bottom: 10px;
            right: 10px;

            font-family: monospace;
            font-size: 14px;

            padding: 8px 10px;
            border-radius: 6px;

            background: rgba(0, 0, 0, 0.7);
            color: #ff4d4d;

            display: none;
            /* hidden by default */
        }

        #status.show {
            display: block;
        }
    </style>
</head>

<body>

    <div id="status">RAID OVERLAY: NOT CONNECTED</div>

    <div id="alert-container">
        <div id="main-text"></div>
        <div id="viewer-text"></div>
    </div>

    <script src="script.js"></script>
    <script>
        const raidContainer = document.getElementById('alert-container');
        const raidMainText = document.getElementById('main-text');
        const raidViewerText = document.getElementById('viewer-text');
        let raidHideTimeout = null;

        // Connect to the overlay relay served by the WebUI (same host/port as this page).
        const relayUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://') + (location.host || '127.0.0.1:8766');

        function handleRaidDisplay(data) {
            raidMainText.innerText = `${data.user.toUpperCase()} RAID!`;
            raidViewerText.innerText = `with ${data.viewers} viewers!`;

            // Trigger reflow to restart animation
            void raidContainer.offsetWidth;

            raidContainer.classList.remove('hide');
            raidContainer.classList.add('show');

            clearTimeout(raidHideTimeout);

            raidHideTimeout = setTimeout(() => {
                raidContainer.classList.remove('show');
                raidContainer.classList.add('hide');
            }, 8000);
        }

        // Initialize and connect WebSocket client
        const wsClient = new OverlayWebSocketClient(relayUrl, 'status', 'RAID');
        wsClient.registerHandler('raid', handleRaidDisplay);
        wsClient.connect();
    </script>

</body>

</html>
