<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Follow Overlay</title>

    <style>
        body {
            margin: 0;
            background: transparent;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }

        #container {
            position: fixed;
            inset: 0;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            opacity: 0;
            pointer-events: none;
            text-align: center;
            padding: 0 50px;
            box-sizing: border-box;
        }

        #main {
            font-size: 100px;
            font-weight: 900;
            color: white;

            text-transform: uppercase;
            letter-spacing: 4px;
            word-wrap: break-word;
            max-width: 90vw;

            text-shadow:
                0 0 10px rgba(255, 20, 147, 0.8),
                0 0 25px rgba(255, 20, 147, 0.5);
        }

        #sub {
            font-size: 38px;
            margin-top: 10px;
            color: #ff69b4;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.6);
            font-weight: 600;
        }

        .show {
            opacity: 1 !important;
            animation: pop 0.35s ease-out forwards;
        }

        .hide {
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        @keyframes pop {
            0% {
                transform: scale(0.6);
                opacity: 0;
            }
            70% {
                transform: scale(1.08);
                opacity: 1;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        #status {
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-family: monospace;
            font-size: 14px;
            padding: 6px 8px;
            background: rgba(0, 0, 0, 0.6);
            color: #ff4d4d;
            display: none;
        }

        #status.show {
            display: block;
        }
    </style>
</head>

<body>

    <div id="status">FOLLOW OVERLAY: NOT CONNECTED</div>

    <div id="container">
        <div id="main"></div>
        <div id="sub">IS NOW FOLLOWING!</div>
    </div>

    <script src="script.js"></script>
    <script>
        const followContainer = document.getElementById('container');
        const followMain = document.getElementById('main');
        let followHideTimeout = null;

        // Connect to the overlay relay served by the WebUI (same host/port as this page).
        const relayUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://') + (location.host || '127.0.0.1:8766');

        function handleFollowDisplay(data) {
            const user = data?.user || "Someone";
            followMain.innerText = user.toUpperCase();

            followContainer.classList.remove('show', 'hide');
            void followContainer.offsetWidth; // Trigger reflow
            followContainer.classList.add('show');

            clearTimeout(followHideTimeout);
            followHideTimeout = setTimeout(() => {
                followContainer.classList.remove('show');
                followContainer.classList.add('hide');
            }, 5000);
        }

        const wsClient = new OverlayWebSocketClient(relayUrl, 'status', 'FOLLOW');
        wsClient.registerHandler('follow', handleFollowDisplay);
        wsClient.connect();
    </script>
</body>
</html>
