<section class="page-shell">
  <p class="page-shell__description">Review the bot's response library — message templates synced from the server. Only the response text can be edited.</p>

  <div class="panel-card">
    <div class="panel-card__header">
      <div>
        <p class="panel-label">Response library</p>
        <h4>Available responses</h4>
      </div>
      <span class="status-chip" id="responses-count">Live</span>
    </div>

    <div class="responses-table" id="responses-table">
      <div class="responses-table__header">
        <span class="responses-col responses-col--key">Response Key</span>
        <span class="responses-col responses-col--category">Category</span>
        <span class="responses-col responses-col--text">Response</span>
      </div>
      <div class="responses-table__body" id="responses-list">
        <p class="responses-empty">Waiting for response data…</p>
      </div>
    </div>
  </div>
</section>
